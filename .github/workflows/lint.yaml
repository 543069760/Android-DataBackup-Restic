name: Lint

on:
  push:
    paths:
      - source/**
  pull_request:
    paths:
      - source/**

jobs:
  build:
    name: "Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source

    permissions:
      contents: write

    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0            # 获取完整提交历史
          submodules: recursive     # 拉取 tar / zstd-jni / rustic_core 子模块

      # ── 原生目录大小遍历单元测试：主机 g++ 直接编译运行（含符号链接环用例）──
      - name: Native calculateSize unit test
        run: |
          set -euo pipefail
          SRC="${{ github.workspace }}/source/native/src/main/jni/nativelib"
          g++ -std=c++17 -Wall -Wextra -DNATIVELIB_UNIT_TEST -I"$SRC" \
            "$SRC/tests/calculate_size_test.cpp" -o /tmp/calculate_size_test
          /tmp/calculate_size_test

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Setup gradle
        uses: gradle/gradle-build-action@v2

      # ── Rust 工具链（settings.gradle.kts 配置阶段调用 cargo metadata 所需）──
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable   # edition 2024 需 Rust >= 1.85
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/native/src/main/jni/external/rustic/rustic
      # ─────────────────────────────────────────────────────────────────

      # ── Go + gomobile（:native:gomobileBindRclone 任务执行 gomobile bind 所需）──
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gobind@latest  
          go install golang.org/x/mobile/cmd/gomobile@latest  
          gomobile init  
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      # ─────────────────────────────────────────────────────────────────

      - name: Setup gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint test

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'