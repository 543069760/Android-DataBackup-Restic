name: Rustic Android Native Build

on:
  workflow_dispatch:
    inputs:
      rustic_version:
        description: 'Rustic 版本 (例如: 0.10.3)'
        required: true
        default: '0.10.3'

jobs:
  build-android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: arm64
            rust_target: aarch64-linux-android
            ndk_target: aarch64-linux-android
          - arch: armv7
            rust_target: armv7-linux-androideabi
            ndk_target: armv7a-linux-androideabi

    steps:
      - name: Checkout Rustic
        uses: actions/checkout@v4
        with:
          repository: rustic-rs/rustic
          ref: v${{ github.event.inputs.rustic_version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up NDK & Build
        env:
          ANDROID_API: 24
        run: |
          set -euo pipefail

          # 1. 定位 NDK 路径
          NDK_DIR="${ANDROID_NDK_LATEST_HOME}"
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          
          # 2. 配置环境变量 (Rust 交叉编译的关键)
          # 将 target 字符串转换为大写并替换横杠，如 AARCH64_LINUX_ANDROID
          TARGET_ENV=$(echo ${{ matrix.rust_target }} | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          
          # 设置链接器，Android NDK 23+ 的路径格式如下
          export CARGO_TARGET_${TARGET_ENV}_LINKER="$TOOLCHAIN/bin/${{ matrix.ndk_target }}${ANDROID_API}-clang"
          export CC_${TARGET_ENV}="$TOOLCHAIN/bin/${{ matrix.ndk_target }}${ANDROID_API}-clang"
          
          echo "Using Linker: $CARGO_TARGET_${TARGET_ENV}_LINKER"

          # 3. 编译 release 版本
          cargo build --release --target ${{ matrix.rust_target }} --bin rustic

          # 4. Strip 二进制（减小体积，去掉调试符号）
          "$TOOLCHAIN/bin/llvm-strip" target/${{ matrix.rust_target }}/release/rustic

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustic-android-${{ matrix.arch }}
          path: target/${{ matrix.rust_target }}/release/rustic
